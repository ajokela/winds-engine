[package]
name = "winds-engine"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
description = "Deterministic wind profiles and radiosonde validation for trajectory simulation"
license = "MIT"
repository = "https://github.com/ajokela/winds-engine"
keywords = ["wind", "ballistics", "radiosonde", "trajectory"]
categories = ["science", "simulation"]

[dependencies]
# The wind-field core (WindField, ProfileField, LogProfile, EkmanProfile,
# HeightOffset) is ballistics-engine's, re-exported; no-default-features keeps
# its online/pdf/cli/ffi/bridge extras out of this data-pipeline crate.
ballistics-engine = { version = "0.49", default-features = false }
nalgebra = "0.35"
grib = { version = "0.20", default-features = false, optional = true }
ureq = { version = "3", optional = true }

[features]
default = []
grib = ["dep:grib"]
download = ["grib", "dep:ureq"]
